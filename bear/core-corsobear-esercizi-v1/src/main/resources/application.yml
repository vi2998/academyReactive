spring:
  profile: development
  application:
    name: "@project.artifactId@"
    version: "@project.version@ (@env.GIT_COMMIT@)"

error-manager:
  enabled: true

connectors:
  jdbcConfigurations:
    default:
      connectionPoolSize: 5
      timeout: 30000
      mocked: false
    items:
      GetCountriesJdbcConnector:
        uri: jdbc:postgresql://localhost:5432/bear
        driver-class-name: org.postgresql.Driver
        username: postgres
        password: example

  jpaConfigurations:
    connection:
      url: jdbc:postgresql://localhost:5432/bear
      driver-class-name: org.postgresql.Driver
      username: postgres
      password: example
      connectionPoolSize: 5
      timeout: 30000
      mocked: false
      hbm2ddl: none
      hibernateDialect: org.hibernate.dialect.PostgreSQLDialect
    repositories:
     - CountryJpaRepositoryConnector

#### Security configuration
keycloak:
  enabled: false
  auth-server-url:
  resource:
  realm:
  public-client: true
  ssl-required: external
  confidential-port: 0
  use-resource-role-mappings: false
  principal-attribute: preferred_username
  bearer-only: true
  autodetect-bearer-only: true
  token-store: cookie
  security-constraints:
    - auth-roles:
        - openid
      security-collections:
        - name: reserved
          patterns:
            - /*
